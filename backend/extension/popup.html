<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 290px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            background: #0a0a0a;
            color: #fff;
            margin: 0;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #a855f7, #00d2a0);
            border-radius: 6px;
        }

        h2 {
            font-size: 16px;
            margin: 0;
            font-weight: 600;
        }

        .status-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .status-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: #888;
        }

        .value {
            font-weight: 500;
        }

        .value.online {
            color: #00d2a0;
        }

        .value.offline {
            color: #ff4b4b;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .btn-primary {
            background: #a855f7;
            color: white;
        }

        .btn-primary:hover {
            background: #9333ea;
        }

        .btn-primary:disabled {
            background: #222;
            color: #666;
            cursor: not-allowed;
        }

        .btn-success {
            background: #00d2a0;
            color: #000;
        }

        .hint {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 8px;
        }

        .watching-info {
            font-size: 11px;
            color: #00d2a0;
            text-align: center;
            margin-top: 10px;
            padding: 6px;
            background: #0a1a14;
            border-radius: 6px;
            word-break: break-all;
            display: none;
        }

        .watching-info.visible {
            display: block;
        }

        .footer {
            margin-top: 12px;
            font-size: 10px;
            color: #444;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo"></div>
        <h2>AISha Bridge</h2>
    </div>

    <div class="status-card">
        <div class="status-row">
            <span class="label">Backend</span>
            <span id="backend-status" class="value offline">Checking...</span>
        </div>
        <div class="status-row">
            <span class="label">Agent Tab</span>
            <span id="agent-tab-status" class="value offline">Checking...</span>
        </div>
    </div>

    <button id="broadcast-btn" class="btn btn-primary" disabled>Broadcast This Tab</button>
    <div id="hint-text" class="hint">Opening agent tab...</div>

    <div id="watching-info" class="watching-info"></div>

    <div class="footer">Version 3.0</div>

    <script src="popup.js"></script>
</body>

</html>
